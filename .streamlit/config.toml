[theme]
primaryColor = "#b30808"         # Color dorado para botones y detalles
backgroundColor = "#080708e1"      # Fondo oscuro elegante (puedes cambiarlo a un tono claro si prefieres)
secondaryBackgroundColor = "#e9e3dbf8" # Fondo de las cajas de búsqueda
textColor = "#720303ec"            # Letras de color blanco hueso muy legibles
font = "sans serif"                 # Tipo de letra elegante estilo libro

